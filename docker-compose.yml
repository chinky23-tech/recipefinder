version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: recipefinder-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: recipefinder
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: recipefinder-backend
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/recipefinder
      JWT_SECRET: recipefinder_super_secret_key_change_in_production_2026
      JWT_ACCESS_EXPIRE_MINUTES: 1440
      JWT_REFRESH_EXPIRE_DAYS: 7
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

volumes:
  pgdata:
